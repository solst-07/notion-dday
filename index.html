<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>D-day Widget</title>
    <style>
        :root {
            --header-bg: #CBE0F8;
            --body-bg: #EBF3FC;
            --text-color: #333333;
            --sub-text: #666666;
            --border-color: #B0D0F5;
            --card-bg: #FFFFFF;
            --input-bg: #FFFFFF;
            --accent-color: #4A90E2;
        }

        /* 5가지 파스텔/모노 팔레트 */
        body.theme-blue { --header-bg: #CBE0F8; --body-bg: #EBF3FC; --border-color: #B0D0F5; }
        body.theme-sage { --header-bg: #D4E2D4; --body-bg: #F0F4F0; --border-color: #B8D0B8; }
        body.theme-beige { --header-bg: #EEDCC5; --body-bg: #F9F5F0; --border-color: #DDC2A3; }
        body.theme-lavender { --header-bg: #E2D9F3; --body-bg: #F4F0F9; --border-color: #C8B8E8; }
        body.theme-mono { --header-bg: #E0E0E0; --body-bg: #F5F5F5; --border-color: #CCCCCC; }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            border-radius: 0 !important; /* 완전한 직각 적용 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--body-bg);
            color: var(--text-color);
            padding: 8px;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .widget-container {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            border: 1px solid var(--border-color);
            background-color: var(--body-bg);
        }

        /* 헤더 스타일 */
        .header {
            background-color: var(--header-bg);
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .header-title {
            font-family: "Georgia", "Times New Roman", serif;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 0.5px;
            color: var(--text-color);
        }

        /* 컨텐츠 영역 */
        .content {
            padding: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-grow: 1;
        }

        /* 시험 카드 스타일 */
        .exam-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 3px;
            position: relative;
        }

        .exam-row-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .exam-title {
            font-weight: 600;
            font-size: 13px;
            color: var(--text-color);
            cursor: pointer;
            word-break: break-all;
        }

        .dday-badge {
            font-size: 11px;
            font-weight: bold;
            padding: 1px 5px;
            background-color: #333;
            color: #fff;
            white-space: nowrap;
        }
        .dday-badge.urgent { background-color: #D9534F; }
        .dday-badge.today { background-color: #F0AD4E; }

        .exam-row-bottom {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 11px;
            color: var(--sub-text);
        }

        .exam-date {
            cursor: pointer;
        }

        .exam-memo {
            font-size: 11px;
            color: #777;
            cursor: pointer;
            margin-top: 1px;
            word-break: break-all;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #aaa;
            cursor: pointer;
            font-size: 13px;
            padding: 0 2px;
        }
        .delete-btn:hover { color: #D9534F; }

        /* 하단 추가 버튼 */
        .add-toggle-btn {
            background-color: var(--card-bg);
            border: 1px dashed var(--border-color);
            color: var(--sub-text);
            padding: 8px;
            text-align: center;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            margin-top: 4px;
        }
        .add-toggle-btn:hover {
            background-color: var(--header-bg);
            color: var(--text-color);
        }

        /* 입력 폼 슬라이드 영역 */
        .add-form {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 8px;
            display: none;
            flex-direction: column;
            gap: 6px;
            margin-top: 4px;
        }
        .add-form.active { display: flex; }

        .add-form input {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            font-size: 12px;
            outline: none;
        }
        .add-form input:focus { border-color: #666; }

        .add-form-btns {
            display: flex;
            gap: 4px;
        }

        .add-form button {
            flex: 1;
            padding: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--header-bg);
            font-weight: 600;
            cursor: pointer;
            font-size: 12px;
        }
        .add-form button.cancel-btn {
            background-color: #f1f1f1;
            color: #555;
        }

        /* 푸터 (팔레트 버튼) */
        .footer {
            padding: 6px 8px;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            border-top: 1px solid var(--border-color);
            margin-top: auto;
        }

        .palette-container {
            position: relative;
        }

        .palette-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            opacity: 0.7;
        }
        .palette-btn:hover { opacity: 1; }

        .palette-popup {
            position: absolute;
            bottom: 24px;
            right: 0;
            background: white;
            border: 1px solid #ccc;
            padding: 4px;
            display: none;
            gap: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 10;
        }
        .palette-popup.active { display: flex; }

        .color-dot {
            width: 14px;
            height: 14px;
            cursor: pointer;
            border: 1px solid rgba(0,0,0,0.2);
        }

        .empty-notice {
            text-align: center;
            color: var(--sub-text);
            font-size: 11px;
            padding: 15px 0;
        }
    </style>
</head>
<body class="theme-blue">

    <div class="widget-container">
        <div class="header">
            <div class="header-title">D-day</div>
        </div>

        <div class="content" id="examList">
            <!-- 시험 카드들이 여기에 동적으로 생성됩니다 -->
        </div>

        <!-- 하단 추가 버튼 (노션 편집 버튼과 겹침 방지) -->
        <div style="padding: 0 8px 8px 8px;">
            <div class="add-toggle-btn" id="toggleFormBtn">+ 과목 추가하기</div>
            
            <div class="add-form" id="addForm">
                <input type="text" id="inputTitle" placeholder="과목명 (예: 중간고사 경영학)">
                <input type="date" id="inputDate">
                <input type="text" id="inputMemo" placeholder="메모 (장소, 범위, 교시 등)">
                <div class="add-form-btns">
                    <button class="cancel-btn" id="cancelBtn">취소</button>
                    <button id="saveBtn">저장</button>
                </div>
            </div>
        </div>

        <div class="footer">
            <div class="palette-container">
                <button class="palette-btn" id="paletteBtn">🎨</button>
                <div class="palette-popup" id="palettePopup">
                    <div class="color-dot" style="background: #CBE0F8;" onclick="setTheme('theme-blue')"></div>
                    <div class="color-dot" style="background: #D4E2D4;" onclick="setTheme('theme-sage')"></div>
                    <div class="color-dot" style="background: #EEDCC5;" onclick="setTheme('theme-beige')"></div>
                    <div class="color-dot" style="background: #E2D9F3;" onclick="setTheme('theme-lavender')"></div>
                    <div class="color-dot" style="background: #E0E0E0;" onclick="setTheme('theme-mono')"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let exams = JSON.parse(localStorage.getItem('notion_exams') || '[]');
        let currentTheme = localStorage.getItem('notion_exam_theme') || 'theme-blue';

        document.body.className = currentTheme;

        const examListEl = document.getElementById('examList');
        const toggleFormBtn = document.getElementById('toggleFormBtn');
        const addForm = document.getElementById('addForm');
        const inputTitle = document.getElementById('inputTitle');
        const inputDate = document.getElementById('inputDate');
        const inputMemo = document.getElementById('inputMemo');
        const saveBtn = document.getElementById('saveBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        
        const paletteBtn = document.getElementById('paletteBtn');
        const palettePopup = document.getElementById('palettePopup');

        // 토글 버튼
        toggleFormBtn.addEventListener('click', () => {
            addForm.classList.toggle('active');
            toggleFormBtn.style.display = addForm.classList.contains('active') ? 'none' : 'block';
            if(addForm.classList.contains('active')) inputTitle.focus();
        });

        cancelBtn.addEventListener('click', () => {
            addForm.classList.remove('active');
            toggleFormBtn.style.display = 'block';
            clearForm();
        });

        paletteBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            palettePopup.classList.toggle('active');
        });

        window.addEventListener('click', () => {
            palettePopup.classList.remove('active');
        });

        function setTheme(theme) {
            document.body.className = theme;
            localStorage.setItem('notion_exam_theme', theme);
            palettePopup.classList.remove('active');
        }

        function clearForm() {
            inputTitle.value = '';
            inputDate.value = '';
            inputMemo.value = '';
        }

            today.setHours(0,0,0,0);
            const target = new Date(dateStr);
            target.setHours
