<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>D-day Widget</title>
    <style>
        :root {
            --header-bg: #CBE0F8;
            --text-color: #333333;
            --sub-text: #666666;
            --border-color: #B0D0F5;
            --card-bg: #FFFFFF;
            --input-bg: #FFFFFF;
        }

        body.theme-blue { --header-bg: #CBE0F8; --border-color: #B0D0F5; }
        body.theme-sage { --header-bg: #D4E2D4; --border-color: #B8D0B8; }
        body.theme-beige { --header-bg: #EEDCC5; --border-color: #DDC2A3; }
        body.theme-lavender { --header-bg: #E2D9F3; --border-color: #C8B8E8; }
        body.theme-mono { --header-bg: #E0E0E0; --border-color: #CCCCCC; }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            border-radius: 0 !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }

        body {
            background-color: transparent; /* 배경 투명화 (노션과 일체화) */
            color: var(--text-color);
            padding: 4px;
            font-size: 13px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .widget-container {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            background-color: transparent;
        }

        .header {
            background-color: var(--header-bg);
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        .header-title {
            font-family: "Georgia", "Times New Roman", serif;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 0.5px;
            color: var(--text-color);
        }

        .content {
            padding: 6px 0;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .exam-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .exam-row-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .exam-title {
            font-weight: 600;
            font-size: 13px;
            color: var(--text-color);
            cursor: pointer;
            word-break: break-all;
        }

        .dday-badge {
            font-size: 11px;
            font-weight: bold;
            padding: 1px 5px;
            background-color: #333;
            color: #fff;
            white-space: nowrap;
        }
        .dday-badge.urgent { background-color: #D9534F; }
        .dday-badge.today { background-color: #F0AD4E; }

        .exam-row-bottom {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            font-size: 11px;
            color: var(--sub-text);
        }

        .exam-date { cursor: pointer; }
        .exam-memo {
            font-size: 11px;
            color: #777;
            cursor: pointer;
            margin-top: 1px;
            word-break: break-all;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #aaa;
            cursor: pointer;
            font-size: 13px;
            padding: 0 2px;
        }
        .delete-btn:hover { color: #D9534F; }

        /* 토글 형태의 과목 추가 버튼 */
        .add-toggle-btn {
            background-color: var(--card-bg);
            border: 1px dashed var(--border-color);
            color: var(--sub-text);
            padding: 8px;
            text-align: center;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            margin-top: 6px;
        }
        .add-toggle-btn:hover {
            background-color: var(--header-bg);
            color: var(--text-color);
        }

        /* 평소에는 숨겨져 있다가 버튼을 누르면 나타나는 입력 폼 */
        .add-form {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 8px;
            display: none;
            flex-direction: column;
            gap: 6px;
            margin-top: 6px;
        }
        .add-form.active { display: flex; }

        .add-form input {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid var(--border-color);
            background-color: var(--input-bg);
            font-size: 12px;
            outline: none;
        }
        .add-form input:focus { border-color: #666; }

        .add-form-btns {
            display: flex;
            gap: 4px;
        }

        .add-form button {
            flex: 1;
            padding: 6px;
            border: 1px solid var(--border-color);
            background-color: var(--header-bg);
            font-weight: 600;
            cursor: pointer;
            font-size: 12px;
        }
        .add-form button.cancel-btn {
            background-color: #f1f1f1;
            color: #555;
        }

        .footer {
            padding: 6px 0;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            margin-top: auto;
        }

        .palette-container { position: relative; }
        .palette-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 14px;
            opacity: 0.7;
        }
        .palette-btn:hover { opacity: 1; }

        .palette-popup {
            position: absolute;
            bottom: 24px;
            right: 0;
            background: white;
            border: 1px solid #ccc;
            padding: 4px;
            display: none;
            gap: 4px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 10;
        }
        .palette-popup.active { display: flex; }

        .color-dot {
            width: 14px;
            height: 14px;
            cursor: pointer;
            border: 1px solid rgba(0,0,0,0.2);
        }

        .empty-notice {
            text-align: center;
            color: var(--sub-text);
            font-size: 11px;
            padding: 15px 0;
        }
    </style>
</head>
<body class="theme-blue">

    <div class="widget-container">
        <div class="header">
            <div class="header-title">D-day</div>
        </div>

        <div class="content" id="examList"></div>

        <!-- 하단 추가 버튼 및 토글 입력 폼 -->
        <div>
            <div class="add-toggle-btn" id="toggleFormBtn">+ 과목 추가하기</div>
            
            <div class="add-form" id="addForm">
                <input type="text" id="inputTitle" placeholder="과목명 (예: 경영학 중간고사)">
                <input type="date" id="inputDate">
                <input type="text" id="inputMemo" placeholder="메모 (장소, 범위, 교시 등)">
                <div class="add-form-btns">
                    <button class="cancel-btn" id="cancelBtn">취소</button>
                    <button id="saveBtn">저장</button>
                </div>
            </div>
        </div>

        <div class="footer">
            <div class="palette-container">
                <button class="palette-btn" id="paletteBtn">🎨</button>
                <div class="palette-popup" id="palettePopup">
                    <div class="color-dot" style="background: #CBE0F8;" onclick="setTheme('theme-blue')"></div>
                    <div class="color-dot" style="background: #D4E2D4;" onclick="setTheme('theme-sage')"></div>
                    <div class="color-dot" style="background: #EEDCC5;" onclick="setTheme('theme-beige')"></div>
                    <div class="color-dot" style="background: #E2D9F3;" onclick="setTheme('theme-lavender')"></div>
                    <div class="color-dot" style="background: #E0E0E0;" onclick="setTheme('theme-mono')"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let exams = [];
        try {
            exams = JSON.parse(localStorage.getItem('notion_exams_v3') || '[]');
        } catch(e) {
            exams = [];
        }

        let currentTheme = localStorage.getItem('notion_exam_theme_v3') || 'theme-blue';
        document.body.className = currentTheme;

        const examListEl = document.getElementById('examList');
        const toggleFormBtn = document.getElementById('toggleFormBtn');
        const addForm = document.getElementById('addForm');
        const inputTitle = document.getElementById('inputTitle');
        const inputDate = document.getElementById('inputDate');
        const inputMemo = document.getElementById('inputMemo');
        const saveBtn = document.getElementById('saveBtn');
        const cancelBtn = document.getElementById('cancelBtn');
        
        const paletteBtn = document.getElementById('paletteBtn');
        const palettePopup = document.getElementById('palettePopup');

        // 추가 버튼 누르면 입력창 열고 닫기
        toggleFormBtn.addEventListener('click', () => {
            addForm.classList.toggle('active');
            toggleFormBtn.style.display = addForm.classList.contains('active') ? 'none' : 'block';
            if(addForm.classList.contains('active')) inputTitle.focus();
        });

        cancelBtn.addEventListener('click', () => {
            addForm.classList.remove('active');
            toggleFormBtn.style.display = 'block';
            clearForm();
        });

        paletteBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            palettePopup.classList.toggle('active');
        });

        window.addEventListener('click', () => {
            palettePopup.classList.remove('active');
        });

        function setTheme(theme) {
            document.body.className = theme;
            localStorage.setItem('notion_exam_theme_v3', theme);
            palettePopup.classList.remove('active');
        }

        function clearForm() {
            inputTitle.value = '';
            inputDate.value = '';
            inputMemo.value = '';
        }

        function calculateDday(dateStr) {
            const today = new Date();
            today.setHours(0,0,0,0);
            const target = new Date(dateStr);
            target.setHours(0,0,0,0);
            
            const diffTime = target - today;
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            
            if (diffDays === 0) return { text: 'D-DAY', class: 'today' };
            if (diffDays > 0) return { text: `D-${diffDays}`, class: diffDays <= 3 ? 'urgent' : '' };
            return { text: `D+${Math.abs(diffDays)}`, class: '' };
        }

        function formatDate(dateStr) {
            const d = new Date(dateStr);
            if(isNaN(d)) return dateStr;
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            const weekdays = ['일', '월', '화', '수', '목', '금', '토'];
            const w = weekdays[d.getDay()];
            return `${m}.${day} (${w})`;
        }

        function renderExams() {
            examListEl.innerHTML = '';
            exams.sort((a, b) => new Date(a.date) - new Date(b.date));

            if (exams.length === 0) {
                examListEl.innerHTML = '<div class="empty-notice">등록된 시험이 없습니다.</div>';
                return;
            }

            exams.forEach((exam, index) => {
                const ddayInfo = calculateDday(exam.date);
                const card = document.createElement('div');
                card.className = 'exam-card';

                card.innerHTML = `
                    <div class="exam-row-top">
                        <span class="exam-title" onclick="editExam(${index})">${escapeHtml(exam.title)}</span>
                        <div style="display: flex; align-items: center; gap: 4px;">
                            <span class="dday-badge ${ddayInfo.class}">${ddayInfo.text}</span>
                            <button class="delete-btn" onclick="deleteExam(${index})">×</button>
                        </div>
                    </div>
                    <div class="exam-row-bottom">
                        <span class="exam-date" onclick="editExam(${index})">${formatDate(exam.date)}</span>
                    </div>
                    ${exam.memo ? `<div class="exam-memo" onclick="editExam(${index})">${escapeHtml(exam.memo)}</div>` : ''}
                `;
                examListEl.appendChild(card);
            });
        }

        saveBtn.addEventListener('click', () => {
            const title = inputTitle.value.trim();
            const date = inputDate.value;
            const memo = inputMemo.value.trim();

            if (!title) {
                alert('과목명을 입력해주세요.');
                inputTitle.focus();
                return;
            }
            if (!date) {
                alert('날짜를 선택해주세요.');
                inputDate.focus();
                return;
            }

            exams.push({ title, date, memo });
            try {
                localStorage.setItem('notion_exams_v3', JSON.stringify(exams));
            } catch(e) {}
            
            clearForm();
            // 저장 완료 후 입력창 닫기 및 추가 버튼 다시 표시
            addForm.classList.remove('active');
            toggleFormBtn.style.display = 'block';
            renderExams();
        });

        window.deleteExam = function(index) {
            exams.splice(index, 1);
            localStorage.setItem('notion_exams_v3', JSON.stringify(exams));
            renderExams();
        }

        window.editExam = function(index) {
            const exam = exams[index];
            const newTitle = prompt('과목명 수정:', exam.title);
            if (newTitle === null) return;
            const newDate = prompt('날짜 수정 (YYYY-MM-DD):', exam.date);
            if (newDate === null) return;
            const newMemo = prompt('메모 수정:', exam.memo || '');
            if (newMemo === null) return;

            exams[index] = { 
                title: newTitle.trim() || exam.title, 
                date: newDate.trim() || exam.date, 
                memo: newMemo.trim() 
            };
            localStorage.setItem('notion_exams_v3', JSON.stringify(exams));
            renderExams();
        }

        function escapeHtml(str) {
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        renderExams();
    </script>
</body>
</html>
